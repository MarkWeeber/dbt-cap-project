models:

  - name: int_positions
    description: Table for Positions info, only necessary columns kept, filtered only by used symbols from symbols seed, surrogate key added over original position_id, trader_id, opened_at and side columns
    columns:
      - name: position_sk
        description: Surrogate key over position_id, trader_id, opened_at and side. Hashes the timestamp value rather than the raw epoch milliseconds, so it can be recomputed from this table
        tests:
          - unique
          - not_null
      - name: position_id
        description: Position ID from source
        tests:
          - not_null  
      - name: trader_id
        description: Trader's ID
        tests:
          - not_null
      - name: symbol
        description: The trading pair symbol (e.g., BTCUSDT or ETHUSDT)
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_symbols')
                field: symbol
      - name: side
        description: Order action direction, either LONG (buy) or SHORT (sell)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LONG', 'SHORT']
      - name: status
        description: The status of position, mainly CLOSED or PARTIALLY_CLOSED, but if OPEN then the record needs additional processing
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CLOSED', 'PARTIALLY_CLOSED', 'OPEN']
      - name: leverage
        description: Multiplier leverage applied to the position
        tests:
          - not_null
      - name: entry_price
        description: Average execution price when entering/opening the position
        tests:
          - not_null
      - name: close_price
        description: Average execution price when closing the position
      - name: opened_volume
        description: Total asset or contract volume when the position was initially opened
        tests:
          - not_null
      - name: closed_volume
        description: Amount of volume that has been closed so far
        tests:
          - not_null
      - name: remaining_volume
        description: Unclosed volume remaining in the position (non-zero for partially closed positions)
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= opened_volume"
      - name: gross_pnl
        description: Gross profit and loss of the position before accounting for fees and funding
        tests:
          - not_null
      - name: funding_pnl
        description: Accumulated funding fees paid or received for holding perpetual futures over time
        tests:
          - not_null
      - name: trading_fee
        description: Total exchange trading fees charged for opening and closing the position
        tests:
          - not_null
      - name: liquidation_fee
        description: Penalty or fee charged if the position was forcibly liquidated by the platform
        tests:
          - not_null
      - name: net_pnl
        description: Final net profit and loss after accounting for gross PnL, funding, and all fees
        tests:
          - not_null
      - name: roi
        description: Return on Investment rate for this specific position calculated by the platform
        tests:
          - not_null
      - name: opened_at
        description: Exact timestamp when the position was opened
        tests:
          - not_null
      - name: closed_at
        description: Exact timestamp when the position was closed
      - name: updated_at
        description: Last write timestamp on the position record. For a partially closed position the macro treats it as the moment of the partial close, since the broker only sets closed_at on full closure, since the broker only sets closed_at on full closure
        tests:
          - not_null

  - name: int_open_position_counts_btc_hourly
    description: Generates an hourly matrix of open position counts for BTCUSDT only, dynamically creating a column for each unique trader by name with spaces replaced by underscores and a symbol-specific and _count.
    columns:
      - name: time
        description: Datetime with hour grain
        tests:
          - unique
          - not_null

  - name: int_open_position_counts_all_hourly
    description: Generates an hourly matrix of open position counts for all allowed symbols, dynamically creating a column for each unique trader by name with spaces replaced by underscores and a _count suffix.
    columns:
      - name: time
        description: Datetime with hour grain
        tests:
          - unique
          - not_null

  - name: int_unrealized_pnl_btc_hourly
    description: >
      Hourly matrix of unrealized PnL on BTCUSDT, one column per trader with a
      _btc_pnl suffix.

      Mark price is the close of the hour. A partially closed position is marked
      on its remaining size from the hour of the partial close onwards; its
      realized leg stays in net_pnl, so the column drops sharply at that hour by
      design.
    columns:
      - name: time
        description: Datetime with hour grain
        tests:
          - unique
          - not_null

  - name: int_h1_timeline
    description: Every distinct hourly bar timestamp present in any approved symbol. A union across symbols, so a gap in one of them does not remove the hour
    columns:
      - name: hour
        description: Start of an hour interval present in at least one approved symbol
        tests:
          - unique
          - not_null