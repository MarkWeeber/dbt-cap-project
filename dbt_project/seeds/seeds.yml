seeds:

  - name: traders
    config:
      column_types:
        trader_id: varchar
    columns:
      - name: trader_id
        data_tests:
          - unique
          - not_null

  - name: extraction_manifest
    config:
      column_types:
        trader_id: varchar

  - name: open_positions
    config:
      column_types:
        trader_id: varchar

  - name: orders
    config:
      column_types:
        trader_id: varchar
        created_at: bigint
        updated_at: bigint
    columns:
      - name: trader_id
        data_tests:
          - not_null
      - name: symbol
        data_tests:
          - not_null
      - name: side
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BUY', 'SELL']
      - name: created_at
        data_tests:
          - not_null
      - name: updated_at
        data_tests:
          - not_null

  - name: positions
    config:
      column_types:
        trader_id: varchar
        position_id: varchar
        opened_at: bigint
        closed_at: bigint
        updated_at: bigint
    columns:
      - name: trader_id
        data_tests:
          - not_null
      - name: position_id
        data_tests:
          - not_null
      - name: symbol
        data_tests:
          - not_null
      - name: opened_at
        data_tests:
          - not_null
      - name: side
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LONG', 'SHORT']